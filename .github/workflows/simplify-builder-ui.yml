name: Simplify Builder UI

on:
  push:
    branches: [platform-core-v1]

permissions:
  contents: write

jobs:
  simplify-builder-ui:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: simplify builder UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch builder UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('platform_core/static/index.html')
          s = p.read_text()
          css = '''\n<style id="cataron-builder-ui">\n.cataron-status{border:1px solid #ddd;border-radius:10px;padding:14px;margin-top:12px;background:#fff}.cataron-status.hidden{display:none}.cataron-status>div:first-child{font-size:18px;font-weight:700}.cataron-status>div:nth-child(2){margin-top:4px;color:#666}.cataron-progress{height:9px;background:#e8e8e8;border-radius:99px;overflow:hidden;margin:12px 0}.cataron-progress>div{height:100%;width:0;background:#222;transition:width .3s}.cataron-phase{padding:7px 9px;border-radius:7px;background:#f3f4f6;margin:4px 0;color:#777}.cataron-phase.done{background:#e9f7ef;color:#171717}.cataron-phase.current{background:#fff6db;color:#171717;font-weight:600}\n</style>\n'''
          if 'id="cataron-builder-ui"' not in s:
              s = s.replace('</style>', '</style>'+css, 1)
          js = r'''<script id="cataron-builder-ui-script">
(function(){
const originalRefreshBuilderPreview=window.refreshBuilderPreview;
let builderPoll=null;
const websitePhases=['Research and plan','Design system','Build pages and content','Create and source visuals','Implement frontend','SEO and accessibility','Configure preview','Run and preview','Automated testing','Browser verification','Repair problems','Re-verify','Final review'];
const appPhases=['Plan application','Design system','Build application','Create assets','Implement frontend','Harden app','Configure preview','Run and preview','Automated testing','Browser verification','Repair problems','Re-verify','Final review'];
function ensurePanel(){if(document.getElementById('cataronBuildStatus'))return;const preview=document.getElementById('builderPreview');if(!preview)return;const panel=document.createElement('div');panel.id='cataronBuildStatus';panel.className='cataron-status hidden';panel.innerHTML='<div id="cataronStatusTitle"></div><div id="cataronStatusDetail"></div><div class="cataron-progress"><div id="cataronProgressBar"></div></div><div id="cataronPhases"></div><div id="cataronNotice" style="margin-top:8px"></div>';preview.before(panel);const oldLog=document.getElementById('log');if(oldLog&&oldLog.closest('.card'))oldLog.closest('.card').style.display='none';const runs=document.getElementById('builderRuns');if(runs)runs.style.display='none'}
function render(r){ensurePanel();const phases=document.querySelector('input[name="builderMode"]:checked')?.value==='app'?appPhases:websitePhases;const step=Math.max(0,r.current_step||0);let title='Cataron is building';let detail='Cataron is working automatically.';let pct=Math.min(100,Math.round(step/phases.length*100));if(r.status==='builder_queued'){title='Waiting for Cataron to start';detail='Your request is safely queued. You do not need to refresh this page.';pct=0}else if(r.status==='builder_awaiting_approval'){title='Approval needed';detail='Check the Approvals panel to allow Cataron to continue.'}else if(r.status==='builder_completed'){title='Build complete';detail='Cataron finished the build.';pct=100}else if(r.status==='builder_cancelled'){title='Build cancelled';detail='This build was stopped.'}else if(r.status==='builder_failed'){title='Build failed';detail='Cataron stopped because an error occurred.'}document.getElementById('cataronStatusTitle').textContent=title;document.getElementById('cataronStatusDetail').textContent=detail;document.getElementById('cataronProgressBar').style.width=pct+'%';document.getElementById('cataronPhases').innerHTML=phases.map((p,i)=>'<div class="cataron-phase '+(i<step?'done':i===step&&r.status==='builder_running'?'current':'')+'">'+(i<step?'✓':i===step&&r.status==='builder_running'?'▶':'○')+' '+p+'</div>').join('');document.getElementById('cataronNotice').textContent=r.status==='builder_awaiting_approval'?'Waiting for your approval.':r.status==='builder_completed'?'Your build is ready.':''}
window.refreshBuilderRuns=async function(){try{const runs=await api('/v1/projects/'+state.project+'/app-builder/runs');if(!runs.length)return;const active=runs.find(r=>r.id===state.builderRun)||runs[0];state.builderRun=active.id;render(active);await originalRefreshBuilderPreview(active.id);const box=document.getElementById('builderPreview');if(box&&!box.innerHTML.includes('Open preview'))box.textContent='No preview yet. Cataron will keep checking automatically.'}catch(e){}};
window.startBuilder=async function(){ensurePanel();if(!state.project){alert('Select a project first.');return}const requirements=document.getElementById('builderRequirements').value.trim();if(requirements.length<20){alert('Please describe the project in at least 20 characters.');return}try{const mode=document.querySelector('input[name="builderMode"]:checked')?.value||'website';const endpoint=mode==='website'?'/v1/projects/'+state.project+'/website-builder':'/v1/projects/'+state.project+'/app-builder';const run=await api(endpoint,{method:'POST',body:{requirements,name:document.getElementById('builderName').value.trim()||(mode==='website'?'AI Website Builder':'AI App Builder'),mode}});state.builderRun=run.run_id;await window.refreshBuilderRuns();if(builderPoll)clearInterval(builderPoll);builderPoll=setInterval(()=>window.refreshBuilderRuns(),3000)}catch(e){alert('The build could not be started. Please try again.')}};
ensurePanel();
})();
</script>
'''
          if 'id="cataron-builder-ui-script"' not in s:
              s = s.replace('</body>', js+'</body>', 1)
          p.write_text(s)
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/static/index.html
          git diff --cached --quiet || git commit -m "chore: simplify builder UI"
          git push
