name: One-time login frontend fix

on:
  push:
    branches: [platform-core-v1]

permissions:
  contents: write

jobs:
  patch-login:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform-core-v1
          fetch-depth: 1

      - name: Repair broken esc helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('platform_core/static/index.html')
          s = p.read_text()
          marker = "function esc(s){"
          start = s.find(marker)
          if start < 0:
              raise SystemExit('esc helper not found; aborting without changes.')
          end = s.find('\n', start)
          if end < 0:
              end = len(s)
          fixed = "function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]))}"
          s = s[:start] + fixed + s[end:]
          p.write_text(s)
          PY

      - name: Commit login fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add platform_core/static/index.html
          git diff --cached --check
          git commit -m "fix: repair login frontend JavaScript"
          git push origin platform-core-v1
