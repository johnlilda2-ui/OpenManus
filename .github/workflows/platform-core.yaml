name: Platform Core

on:
  pull_request:
    paths:
      - "platform_core/**"
      - "alembic/**"
      - "tests/platform_core/**"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/platform-core.yaml"
  push:
    branches: [main, platform-core-v1]
    paths:
      - "platform_core/**"
      - "alembic/**"
      - "tests/platform_core/**"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/platform-core.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q platform_core alembic
      - name: Platform tests
        run: pytest -q tests/platform_core
