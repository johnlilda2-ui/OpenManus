name: Fix builder activity UI
on:
  push:
    branches: [platform-core-v1]
    paths:
      - .github/workflows/fix-builder-activity-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch builder activity display
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('platform_core/static/index.html')
          text = path.read_text()
          pattern = re.compile(r"function showStatus\(run\)\{.*?\}\nasync function refreshBuilderRuns", re.S)
          replacement = r'''function builderActivityMessage(event){
          const p=event?.payload||{};
          const name=String(p.name||'').toLowerCase();
          const role=String(p.role||'').toLowerCase();
          if(event?.kind==='builder.completed')return 'Cataron finished the website.';
          if(event?.kind==='builder.failed')return 'Cataron hit an issue while building.';
          if(event?.kind==='builder.cancelled')return 'Cataron stopped the build.';
          if(event?.kind==='approval.required')return 'Cataron needs your approval before continuing.';
          if(event?.kind==='builder.cancel_requested')return 'Cataron is stopping the current work.';
          if(event?.kind==='builder.step_started'){
            if(role==='fixer'||name.includes('repair')||name.includes('fix'))return 'Cataron found an issue and is fixing it.';
            if(role==='reviewer'||name.includes('review')||name.includes('verification')||name.includes('verify'))return 'Cataron is checking the website.';
            if(role==='designer'||name.includes('design')||name.includes('visual'))return 'Cataron is designing the website.';
            if(role==='tester'||name.includes('test')||name.includes('qa'))return 'Cataron is testing the website.';
            if(name.includes('preview')||name.includes('run and preview'))return 'Cataron is preparing the live preview.';
            if(role==='planner'||name.includes('research')||name.includes('plan'))return 'Cataron is planning the website.';
            return 'Cataron is building the website.';
          }
          if(event?.kind==='builder.agent_progress')return role==='fixer'?'Cataron is fixing an issue.':role==='designer'?'Cataron is designing the website.':role==='tester'?'Cataron is testing the website.':role==='reviewer'?'Cataron is checking the website.':'Cataron is building the website.';
          return null;
          }
          function showStatus(run){
          $('builderStatus').classList.remove('hidden');
          let title='Cataron is building',detail='Cataron is working automatically.',pct=0;
          if(run.status==='builder_queued'){title='Waiting for Cataron to start';detail='Your build is safely queued.';}
          else if(run.status==='builder_running'){detail='Cataron is working on your website.';}
          else if(run.status==='builder_awaiting_approval'){title='Approval needed';detail='Cataron is waiting for an approval.';}
          else if(run.status==='builder_completed'){title='Build complete';detail='Cataron finished the build.';pct=100;}
          else if(run.status==='builder_cancelled'){title='Build cancelled';detail='This build was stopped.';}
          else if(run.status==='builder_failed'){title='Build failed';detail=run.error||'An error occurred.';}
          const activity=state.builderActivity||[];
          const current=[...activity].reverse().map(builderActivityMessage).find(Boolean);
          if(run.status==='builder_running'&&current)detail=current;
          $('builderStatus').innerHTML=`<b>${esc(title)}</b><div class="muted">${esc(detail)}</div><div class="progress"><div style="width:${pct}%"></div></div>`;
          }
          async function refreshBuilderRuns'''
          if not pattern.search(text):
              raise SystemExit('showStatus function pattern not found')
          path.write_text(pattern.sub(replacement, text, count=1))
          PY
      - name: Commit UI patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/static/index.html .github/workflows/fix-builder-activity-ui.yml
          git rm .github/workflows/fix-builder-activity-ui.yml
          git commit -m "fix: show builder activity as current work"
          git push
