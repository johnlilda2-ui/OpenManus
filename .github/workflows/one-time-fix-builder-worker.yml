name: One-time fix builder worker queue

on:
  push:
    branches:
      - platform-core-v1

permissions:
  contents: write

jobs:
  fix-builder-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform-core-v1
        uses: actions/checkout@v4
        with:
          ref: platform-core-v1

      - name: Patch worker queue dispatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("platform_core/worker.py")
          text = path.read_text(encoding="utf-8")

          old = '''            item = await redis.brpop(settings.queue_name, timeout=5)\n            selected_item = item[1] if item else None\n            if selected_item:\n                if selected_item.startswith("workflow:"):\n                    claimed = await claim_workflow_run(selected_item.split(":", 1)[1])\n                    if claimed:\n                        await process_workflow_run(claimed)\n                else:\n                    task_id = selected_item.split(":", 1)[1] if selected_item.startswith("task:") else selected_item\n                    claimed = await claim_queued_task(task_id)\n                    if claimed:\n                        await process_task(claimed)\n                continue\n'''

          new = '''            item = await redis.brpop(\n                settings.queue_name,\n                settings.builder_queue_name,\n                timeout=5,\n            )\n            selected_item = item[1] if item else None\n            if selected_item:\n                if selected_item.startswith("builder:"):\n                    from platform_core.app_builder_worker import claim_builder_run, process_builder_run\n\n                    builder_id = selected_item.split(":", 1)[1]\n                    claimed = await claim_builder_run(builder_id)\n                    if claimed:\n                        await process_builder_run(claimed)\n                elif selected_item.startswith("workflow:"):\n                    claimed = await claim_workflow_run(selected_item.split(":", 1)[1])\n                    if claimed:\n                        await process_workflow_run(claimed)\n                else:\n                    task_id = selected_item.split(":", 1)[1] if selected_item.startswith("task:") else selected_item\n                    claimed = await claim_queued_task(task_id)\n                    if claimed:\n                        await process_task(claimed)\n                continue\n'''

          if old not in text:
              raise SystemExit("Expected worker queue block not found; refusing to modify the file")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python -m py_compile platform_core/worker.py

      - name: Commit worker fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/worker.py .github/workflows/one-time-fix-builder-worker.yml
          git commit -m "Fix worker to consume app builder queue"
          git push origin HEAD:platform-core-v1
