name: One-time simple website builder optimization

on:
  push:
    branches: [platform-core-v1]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform-core-v1
          fetch-depth: 0

      - name: Patch builder lifecycle and fast path
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app/agent/base.py")
          s = p.read_text()
          if "cleanup_after_run: bool = True" not in s:
              marker = '    max_steps: int = Field(default=10, description="Maximum steps before termination")\n'
              if marker not in s:
                  raise SystemExit("BaseAgent max_steps field not found")
              s = s.replace(marker, marker + "    cleanup_after_run: bool = True\n", 1)
          old = "        await SANDBOX_CLIENT.cleanup()\n        return \"\\n\".join(results) if results else \"No steps executed\"\n"
          new = "        if self.cleanup_after_run:\n            await SANDBOX_CLIENT.cleanup()\n        return \"\\n\".join(results) if results else \"No steps executed\"\n"
          if old not in s:
              raise SystemExit("BaseAgent cleanup block not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("app/agent/sandbox_agent.py")
          s = p.read_text()
          marker = "    max_steps: int = 20\n"
          if "cleanup_after_run: bool = False" not in s:
              if marker not in s:
                  raise SystemExit("SandboxManus max_steps marker not found")
              s = s.replace(marker, marker + "    cleanup_after_run: bool = False\n", 1)
          p.write_text(s)

          p = Path("platform_core/website_builder.py")
          s = p.read_text()
          marker = "    steps = [\n"
          if "SIMPLE_STATIC_WEBSITE" not in s:
              if marker not in s:
                  raise SystemExit("website_builder steps marker not found")
              fast = '''    normalized = requirements.lower()\n    simple_static = (\n        "SIMPLE_STATIC_WEBSITE"\n        if (\n            "one-page" in normalized\n            and ("plain html" in normalized or "html/css/javascript" in normalized or "html/css/js" in normalized)\n            and not any(term in normalized for term in ("marketplace", "e-commerce", "ecommerce", "saas", "booking", "dashboard", "database", "authentication"))\n        )\n        else None\n    )\n    if simple_static:\n        return [\n            {\n                "name": "Build, preview and verify simple website",\n                "prompt": f"""{shared}\n\nThis is a SIMPLE_STATIC_WEBSITE request. Do not run the long research/design/QA pipeline. Build the requested one-page website directly in the project root using only plain HTML, CSS and JavaScript.\n\nCreate exactly these files unless genuinely needed otherwise: index.html, styles.css, script.js. Make the page polished, responsive, accessible, and visually coherent. Implement the requested hero, About, three project cards, and contact section. Do not invent real people's identities, real client claims, or fake external project URLs. Use safe local placeholders for links.\n\nAfter creating the files, launch a simple local server INSIDE the Daytona sandbox with a persistent named session on port 8080 and the project directory as the document root. Verify it with curl. Then call the sandbox preview tool for port 8080 and capture its browser-accessible URL. Leave the preview running.\n\nReturn exactly:\nPREVIEW_URL: <the real preview URL>\nWEBSITE_READY: true\n""",\n                "model_profile": "builder",\n                "role": "builder",\n                "max_attempts": 1,\n                "browser_required": False,\n            }\n        ]\n\n'''
              s = s.replace(marker, fast + marker, 1)
          p.write_text(s)

          p = Path("platform_core/app_builder_worker.py")
          s = p.read_text()
          if "builder.preview_ready" not in s:
              old = '                if completed:\n                    async with SessionLocal() as session:\n'
              new = '''                if completed:\n                    preview_match = re.search(r"PREVIEW_URL\\s*[:=]\\s*(https?://[^\\s)]+)", result or "", flags=re.IGNORECASE)\n                    async with SessionLocal() as session:\n                        if preview_match:\n                            await add_workflow_event(session, run_id, "builder.preview_ready", {"url": preview_match.group(1).rstrip(".,"), "step_index": step_index})\n                        await session.commit()\n                    async with SessionLocal() as session:\n'''
              if old not in s:
                  raise SystemExit("builder completed block not found")
              s = s.replace(old, new, 1)
              if "import re\n" not in s:
                  s = s.replace("import os\n", "import os\nimport re\n", 1)
          p.write_text(s)

          Path(".github/workflows/fix-simple-website-builder.yml").unlink()

      - name: Commit permanent patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/agent/base.py app/agent/sandbox_agent.py platform_core/website_builder.py platform_core/app_builder_worker.py
          git rm -f .github/workflows/fix-simple-website-builder.yml || true
          git commit -m "fix: keep builder sandbox alive and fast-path simple websites"
          git push origin platform-core-v1
