# Global LLM configuration
[llm]
model = "claude-3-7-sonnet-20250219"
base_url = "https://api.anthropic.com/v1/"
# Use secret://llm_api_key in production instead of committing a credential.
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.0

# Example Amazon Bedrock configuration:
# api_type = "aws"
# model = "us.anthropic.claude-3-7-sonnet-20250219-v1:0"
# base_url = "bedrock-runtime.us-west-2.amazonaws.com"
# api_key = "secret://bedrock_api_key"
# max_tokens = 8192
# temperature = 1.0

# Example Azure OpenAI configuration:
# api_type = "azure"
# model = "YOUR_MODEL_NAME"
# base_url = "https://YOUR_AZURE_ENDPOINT/openai/deployments/YOUR_DEPLOYMENT"
# api_key = "secret://azure_api_key"
# max_tokens = 8096
# temperature = 0.0
# api_version = "2024-08-01-preview"

[llm.vision]
model = "claude-3-7-sonnet-20250219"
base_url = "https://api.anthropic.com/v1/"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.0

# Daytona is required for the production sandbox boundary.
[daytona]
daytona_api_key = "secret://openmanus_daytona_api_key"
daytona_server_url = "https://app.daytona.io/api"
daytona_target = "us"
sandbox_image_name = "whitezxj/sandbox:0.1.0"
sandbox_entrypoint = "/usr/bin/supervisord -n -c /etc/supervisor/conf.d/supervisord.conf"
VNC_password = "change-me-in-runtime"

# Optional browser configuration
# [browser]
# headless = false
# disable_security = true
# extra_chromium_args = []
# chrome_instance_path = ""
# wss_url = ""
# cdp_url = ""

# Optional search configuration
# [search]
# engine = "Google"
# fallback_engines = ["DuckDuckGo", "Baidu", "Bing"]
# retry_delay = 60
# max_retries = 3
# lang = "en"
# country = "us"

# Optional local sandbox defaults. Production platform policy ignores direct host execution.
# [sandbox]
# use_sandbox = false
# image = "python:3.12-slim"
# work_dir = "/workspace"
# memory_limit = "1g"
# cpu_limit = 2.0
# timeout = 300
# network_enabled = false

[mcp]
server_reference = "app.mcp.server"

[runflow]
use_data_analysis_agent = false
