# Global LLM configuration
[llm]
model = "YOUR_DEFAULT_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
# Use secret://openmanus_llm_api_key in production instead of committing a credential.
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.2

# The App Builder uses logical roles instead of hard-coding a vendor.
# Point each role at the same provider or at different providers/models.
# Requested profiles override these logical names when they exist; otherwise the router falls back to [llm].

[llm.planner]
model = "YOUR_REASONING_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.1

[llm.builder]
model = "YOUR_CODE_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.2

[llm.designer]
model = "YOUR_UI_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.4

[llm.tester]
model = "YOUR_FAST_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.1

[llm.fixer]
model = "YOUR_CODE_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.2

[llm.reviewer]
model = "YOUR_REVIEW_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.1

[llm.vision]
model = "YOUR_VISION_MODEL"
base_url = "https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1"
api_key = "secret://openmanus_llm_api_key"
max_tokens = 8192
temperature = 0.2

# Example Amazon Bedrock configuration:
# api_type = "aws"
# model = "YOUR_BEDROCK_MODEL"
# base_url = "bedrock-runtime.us-west-2.amazonaws.com"
# api_key = "secret://bedrock_api_key"
# max_tokens = 8192
# temperature = 0.2

# Example Azure OpenAI configuration:
# api_type = "azure"
# model = "YOUR_MODEL_NAME"
# base_url = "https://YOUR_AZURE_ENDPOINT/openai/deployments/YOUR_DEPLOYMENT"
# api_key = "secret://azure_api_key"
# max_tokens = 8192
# temperature = 0.2
# api_version = "YOUR_API_VERSION"

# Daytona-backed production sandbox configuration.
[daytona]
daytona_api_key = "secret://openmanus_daytona_api_key"
daytona_server_url = "https://app.daytona.io/api"
daytona_target = "us"
sandbox_image_name = "whitezxj/sandbox:0.1.0"
sandbox_entrypoint = "/usr/bin/supervisord -n -c /etc/supervisor/conf.d/supervisord.conf"
VNC_password = "secret://openmanus_vnc_password"

# Optional browser configuration
# [browser]
# headless = false
# disable_security = true
# extra_chromium_args = []
# chrome_instance_path = ""
# wss_url = ""
# cdp_url = ""

# Optional search configuration
# [search]
# engine = "Google"
# fallback_engines = ["DuckDuckGo", "Baidu", "Bing"]
# retry_delay = 60
# max_retries = 3
# lang = "en"
# country = "us"

# Optional local sandbox defaults. The production platform routes risky execution through Daytona.
# [sandbox]
# use_sandbox = false
# image = "python:3.12-slim"
# work_dir = "/workspace"
# memory_limit = "1g"
# cpu_limit = 2.0
# timeout = 300
# network_enabled = false

[mcp]
server_reference = "app.mcp.server"

[runflow]
use_data_analysis_agent = false
