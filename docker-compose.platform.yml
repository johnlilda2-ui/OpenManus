services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openmanus
      POSTGRES_USER: openmanus
      POSTGRES_PASSWORD: openmanus
    ports: ["5432:5432"]
    volumes: ["openmanus-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmanus -d openmanus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.platform
    command: ["alembic", "upgrade", "head"]
    environment:
      OPENMANUS_ENV: development
      DATABASE_URL: postgresql+asyncpg://openmanus:openmanus@postgres:5432/openmanus
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.platform
    command: ["uvicorn", "platform_core.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OPENMANUS_ENV: development
      OPENMANUS_AUTO_CREATE_DB: "false"
      OPENMANUS_JWT_SECRET: ${OPENMANUS_JWT_SECRET:-change-this-before-production}
      DATABASE_URL: postgresql+asyncpg://openmanus:openmanus@postgres:5432/openmanus
      REDIS_URL: redis://redis:6379/0
      OPENMANUS_ARTIFACT_ROOT: /data/artifacts
      OPENMANUS_SANDBOX_ENABLED: ${OPENMANUS_SANDBOX_ENABLED:-false}
      OPENMANUS_S3_BUCKET: ${OPENMANUS_S3_BUCKET:-}
      OPENMANUS_S3_ENDPOINT_URL: ${OPENMANUS_S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-}
    ports: ["8000:8000"]
    volumes:
      - ./config:/app/config:ro
      - openmanus-artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.platform
    command: ["python", "-m", "platform_core.worker"]
    environment:
      OPENMANUS_ENV: development
      OPENMANUS_AUTO_CREATE_DB: "false"
      OPENMANUS_JWT_SECRET: ${OPENMANUS_JWT_SECRET:-change-this-before-production}
      DATABASE_URL: postgresql+asyncpg://openmanus:openmanus@postgres:5432/openmanus
      REDIS_URL: redis://redis:6379/0
      OPENMANUS_ARTIFACT_ROOT: /data/artifacts
      OPENMANUS_SANDBOX_ENABLED: ${OPENMANUS_SANDBOX_ENABLED:-false}
      OPENMANUS_S3_BUCKET: ${OPENMANUS_S3_BUCKET:-}
      OPENMANUS_S3_ENDPOINT_URL: ${OPENMANUS_S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - ./config:/app/config:ro
      - openmanus-artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  openmanus-postgres:
  openmanus-artifacts:
