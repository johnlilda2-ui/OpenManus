services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openmanus
      POSTGRES_USER: openmanus
      POSTGRES_PASSWORD: openmanus
    ports:
      - "5432:5432"
    volumes:
      - openmanus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmanus -d openmanus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.platform
    command: ["uvicorn", "platform_core.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OPENMANUS_ENV: development
      OPENMANUS_JWT_SECRET: ${OPENMANUS_JWT_SECRET:-change-this-before-production}
      DATABASE_URL: postgresql+asyncpg://openmanus:openmanus@postgres:5432/openmanus
      REDIS_URL: redis://redis:6379/0
      OPENMANUS_CORS_ORIGINS: ${OPENMANUS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.platform
    command: ["python", "-m", "platform_core.worker"]
    environment:
      OPENMANUS_ENV: development
      OPENMANUS_JWT_SECRET: ${OPENMANUS_JWT_SECRET:-change-this-before-production}
      DATABASE_URL: postgresql+asyncpg://openmanus:openmanus@postgres:5432/openmanus
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  openmanus-postgres:
